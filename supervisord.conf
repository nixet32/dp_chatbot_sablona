[supervisord]
nodaemon=true
user=root

[program:api]
command=uvicorn api_server:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:actions]
command=python -m rasa_sdk --actions actions.actions --port 5055
directory=/app
environment=PYTHONPATH="/app",BACKEND_PROVIDER="local_api",API_BASE_URL="http://127.0.0.1:8000"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rasa]
command=rasa run --enable-api --cors "*" --model /app/models --credentials /app/rasa/credentials.yml --endpoints /app/rasa/endpoints.yml --port 5005
directory=/app/rasa
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0